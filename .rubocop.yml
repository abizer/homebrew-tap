# Casks/nssh.rb is generated by goreleaser, whose template indents the
# zap-stanza array two spaces deeper than RuboCop wants and always emits
# a blank line before the cask's closing `end`. Both are template bugs we
# can't fix from .goreleaser.yaml. Disable just those cops for that file
# until upstream addresses it.

Layout/FirstArrayElementIndentation:
  Exclude:
    - Casks/nssh.rb

Layout/EmptyLinesAroundBlockBody:
  Exclude:
    - Casks/nssh.rb
