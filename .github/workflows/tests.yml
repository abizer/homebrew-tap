name: brew test-bot

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-15]  # arm64 runner (wtop is Apple Silicon only)
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup

      # `brew test-bot --only-tap-syntax` runs:
      #   1. brew style abizer/tap
      #   2. brew readall --aliases --os=all --arch=all abizer/tap
      #   3. brew audit --except=installed --tap=abizer/tap
      # Step (1) fails on Casks/nssh.rb because goreleaser's cask template
      # emits indentation and trailing-blank patterns that rubocop rejects,
      # and Homebrew's rubocop config (a) ignores tap-local .rubocop.yml
      # and (b) forbids inline `# rubocop:disable` directives. So instead,
      # run style only on hand-written files and let readall+audit cover
      # the generated cask. Drop this scoping once goreleaser fixes the
      # template — see https://github.com/abizer/homebrew-tap/issues/4.
      - name: brew style (hand-written files)
        run: |
          set -euo pipefail
          mapfile -t files < <(find Casks Formula -name '*.rb' ! -name 'nssh.rb' 2>/dev/null)
          if [ "${#files[@]}" -gt 0 ]; then
            brew style "${files[@]}"
          fi
      - run: brew readall --aliases --os=all --arch=all abizer/tap
      - run: brew audit --except=installed --tap=abizer/tap

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
